<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TV Estación Mix - Zócalo & Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* -------------------------------------------------------------
           1. ZÓCALO (ABAJO A LA IZQUIERDA PARA OBS)
           ------------------------------------------------------------- */
        .zocalo-screen {
            position: fixed;
            bottom: 40px;
            left: 40px;
            display: flex;
            align-items: stretch;
            background: rgba(15, 15, 26, 0.95);
            border-left: 6px solid #ff0055;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 0, 85, 0.4);
            max-width: 850px;
            color: #ffffff;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
        }

        .zocalo-screen.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .badge-canal {
            background: linear-gradient(135deg, #ff0055, #7928ca);
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top-left-radius: 2px;
            border-bottom-left-radius: 2px;
            min-width: 140px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .badge-canal .titulo { font-size: 18px; color: #fff; }
        .badge-canal .subtitulo { font-size: 10px; color: #00f2fe; letter-spacing: 2px; }

        .contenido {
            padding: 12px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-usuario {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .nombre-usuario { font-size: 18px; font-weight: 700; color: #00f2fe; }
        .lugar-usuario {
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .mensaje-texto { font-size: 16px; color: #eeeeee; font-weight: 400; line-height: 1.3; }

        /* -------------------------------------------------------------
           2. BOTÓN Y MODAL ADMIN (CORREGIDO Y CENTRADO EN PANTALLA)
           ------------------------------------------------------------- */
        .btn-abrir-panel {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid #ff0055;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            z-index: 99998;
            font-size: 13px;
            font-weight: bold;
        }

        .admin-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            z-index: 99999; /* Asegura quedar por encima de todo */
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .admin-modal.active { display: flex; }

        .admin-card {
            background: #121222;
            border: 1px solid #ff0055;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }

        .admin-card h2 { margin-bottom: 15px; color: #00f2fe; text-align: center; font-size: 20px; }
        .admin-card label { display: block; margin-top: 12px; font-size: 13px; color: #ccc; }
        .admin-card input, .admin-card textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #090910;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }

        .admin-card button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            background: linear-gradient(135deg, #ff0055, #7928ca);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .status-msg { margin-top: 12px; font-size: 13px; text-align: center; color: #00f2fe; }
    </style>
</head>
<body>

    <!-- ZÓCALO DE TRANSMISIÓN -->
    <div class="zocalo-screen" id="zocalo">
        <div class="badge-canal">
            <span class="titulo">DJ TV</span>
            <span class="subtitulo">ESTACIÓN MIX</span>
        </div>
        <div class="contenido">
            <div class="header-usuario">
                <span class="nombre-usuario" id="nombre">Cargando...</span>
                <span class="lugar-usuario" id="lugar">Argentina</span>
            </div>
            <div class="mensaje-texto" id="mensaje">Conectando...</div>
        </div>
    </div>

    <!-- BOTÓN ADMIN -->
    <button class="btn-abrir-panel" onclick="abrirLogin()">Panel Admin</button>

    <!-- MODAL FLOTANTE CENTRADO -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-card" id="formLogin">
            <h2>Acceso al Panel</h2>
            <label>Contraseña:</label>
            <input type="password" id="inputPass" placeholder="Ingresá clave">
            <button onclick="validarPass()">Ingresar</button>
            <button onclick="cerrarPanel()" style="background: #333; margin-top: 8px;">Cerrar</button>
        </div>

        <div class="admin-card" id="formMensaje" style="display:none;">
            <h2>Enviar Saludo Real</h2>
            <label>Nombre:</label>
            <input type="text" id="inputNombre" placeholder="Ej: Cristian">
            <label>Ubicación:</label>
            <input type="text" id="inputLugar" placeholder="Ej: Chaco">
            <label>Mensaje:</label>
            <textarea id="inputTexto" rows="3" placeholder="Escribí el mensaje..."></textarea>
            
            <button onclick="guardarMensajeManual()">Publicar a Zócalo</button>
            <div class="status-msg" id="statusMsg"></div>
            <button onclick="cerrarPanel()" style="background: #333; margin-top: 10px;">Salir</button>
        </div>
    </div>

    <script>
        const CLAVE_ADMIN = "you120";
        const TIEMPO_VISIBILIDAD = 8000;
        const TIEMPO_OCULTO = 12000;

        let mensajesReales = JSON.parse(localStorage.getItem('mensajesReales')) || [];
        let aprendizajeEstilo = JSON.parse(localStorage.getItem('aprendizajeEstilo')) || [];
        let historialUbicaciones = [];
        let historialNombres = [];

        const zocalo = document.getElementById('zocalo');
        const nombreEl = document.getElementById('nombre');
        const lugarEl = document.getElementById('lugar');
        const mensajeEl = document.getElementById('mensaje');

        // Leer mensaje enviado directo por URL desde otro dispositivo
        function cargarMensajeDesdeURL() {
            const params = new URLSearchParams(window.location.search);
            const nombre = params.get('nombre');
            const lugar = params.get('lugar');
            const mensaje = params.get('mensaje');

            if (nombre && lugar && mensaje) {
                mensajesReales.push({ nombre, lugar, mensaje });
                // Limpiar la URL sin recargar la página
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        function abrirLogin() {
            document.getElementById('adminModal').classList.add('active');
        }

        function cerrarPanel() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('formLogin').style.display = 'block';
            document.getElementById('formMensaje').style.display = 'none';
            document.getElementById('inputPass').value = '';
        }

        function validarPass() {
            if (document.getElementById('inputPass').value === CLAVE_ADMIN) {
                document.getElementById('formLogin').style.display = 'none';
                document.getElementById('formMensaje').style.display = 'block';
            } else {
                alert("Contraseña incorrecta");
            }
        }

        function guardarMensajeManual() {
            const nombre = document.getElementById('inputNombre').value.trim();
            const lugar = document.getElementById('inputLugar').value.trim();
            const mensaje = document.getElementById('inputTexto').value.trim();

            if (!nombre || !lugar || !mensaje) {
                alert("Completá todos los campos.");
                return;
            }

            const nuevoObj = { nombre, lugar, mensaje };
            mensajesReales.push(nuevoObj);
            localStorage.setItem('mensajesReales', JSON.stringify(mensajesReales));

            aprendizajeEstilo.push(nuevoObj);
            if(aprendizajeEstilo.length > 20) aprendizajeEstilo.shift();
            localStorage.setItem('aprendizajeEstilo', JSON.stringify(aprendizajeEstilo));

            document.getElementById('inputNombre').value = '';
            document.getElementById('inputLugar').value = '';
            document.getElementById('inputTexto').value = '';

            const status = document.getElementById('statusMsg');
            status.textContent = "¡Enviado! Saldrá en el próximo ciclo.";
            setTimeout(() => status.textContent = "", 3000);
        }

        async function obtenerSiguienteMensaje() {
            cargarMensajeDesdeURL();

            if (mensajesReales.length > 0) {
                const mensajePrioritario = mensajesReales.shift();
                localStorage.setItem('mensajesReales', JSON.stringify(mensajesReales));
                return mensajePrioritario;
            }

            return await generarMensajeConIA();
        }

        async function generarMensajeConIA() {
            let ejemplosTexto = "";
            if (aprendizajeEstilo.length > 0) {
                ejemplosTexto = "Imitá este estilo de mensajes reales:\n";
                aprendizajeEstilo.slice(-5).forEach(m => {
                    ejemplosTexto += `- "${m.nombre} de ${m.lugar}: ${m.mensaje}"\n`;
                });
            }

            const promptSystem = `
            Sos un simulador de audiencia para el canal "DJ TV Estación Mix" en Argentina.
            Responde OBLIGATORIAMENTE con un JSON puro con las claves "nombre", "lugar", "mensaje".

            ANTI-REPETICIÓN:
            Nombres prohibidos: [${historialNombres.join(', ')}].
            Ubicaciones prohibidas: [${historialUbicaciones.join(', ')}].

            REGLAS:
            ${ejemplosTexto}
            - Mensaje de máximo 120 caracteres.
            - Tono argentino de radio/TV alegre y espontáneo.
            `;

            try {
                // Petición directa a Cloudflare Worker
                const response = await fetch("https://groq-proxy.fachacarlos1.workers.dev", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        response_format: { type: "json_object" },
                        messages: [
                            { role: "system", content: promptSystem },
                            { role: "user", content: "Generá un nuevo mensaje." }
                        ],
                        temperature: 0.95
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices[0]) {
                    const res = JSON.parse(data.choices[0].message.content);
                    if (res.nombre && res.lugar) {
                        historialNombres.push(res.nombre);
                        historialUbicaciones.push(res.lugar);
                        if (historialNombres.length > 5) historialNombres.shift();
                        if (historialUbicaciones.length > 5) historialUbicaciones.shift();
                    }
                    return res;
                }
                return obtenerMensajeBackup();

            } catch (err) {
                return obtenerMensajeBackup();
            }
        }

        function obtenerMensajeBackup() {
            const backups = [
                { nombre: "Cristian", lugar: "Chaco", mensaje: "Hola soy cristian de chaco los veo todo el día." },
                { nombre: "Mariela", lugar: "Posadas", mensaje: "Buenas noches me encanta la música del canal." },
                { nombre: "Gonzalo", lugar: "Mendoza", mensaje: "¡Un saludo a toda la gente prendida a Estación Mix!" },
                { nombre: "Facu", lugar: "Córdoba", mensaje: "Prendidísimo a DJ TV con unos buenos mates." }
            ];
            return backups[Math.floor(Math.random() * backups.length)];
        }

        async function cicloPantalla() {
            const data = await obtenerSiguienteMensaje();

            nombreEl.textContent = data.nombre;
            lugarEl.textContent = data.lugar;
            mensajeEl.textContent = `"${data.mensaje}"`;

            zocalo.classList.add('visible');

            setTimeout(() => {
                zocalo.classList.remove('visible');
            }, TIEMPO_VISIBILIDAD);
        }

        function arrancar() {
            cicloPantalla();
            setInterval(cicloPantalla, TIEMPO_VISIBILIDAD + TIEMPO_OCULTO);
        }

        setTimeout(arrancar, 2000);
    </script>
</body>
</html>
